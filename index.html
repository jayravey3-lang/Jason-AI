<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080b16"><meta name="description" content="Jason AI — your personal intelligent assistant.">
<title>Jason AI — Your personal assistant</title>
<style>
:root{color-scheme:dark;--bg:#080b16;--panel:#10172a;--line:#26334d;--text:#edf3ff;--muted:#91a1bd;--accent:#7c8cff;--cyan:#52d9e8}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#233b72 0,transparent 48%),var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
.app{max-width:1050px;margin:auto;min-height:100vh;display:flex;flex-direction:column;padding:22px}
header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff16;padding:5px 0 18px}.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:20px;letter-spacing:.4px}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--cyan));display:grid;place-items:center;color:#07101d;font-weight:900;box-shadow:0 0 28px #718bff55}.status{color:var(--muted);font-size:12px}.status:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#53dda4;margin-right:8px}
main{flex:1;display:flex;flex-direction:column;max-width:790px;width:100%;margin:36px auto 20px}.hero{text-align:center;margin:25px 0 28px}.orb{width:78px;height:78px;margin:auto auto 18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#a8eaff,#777eff 42%,#342e83 75%);box-shadow:0 0 55px #687cff66;animation:float 4s ease-in-out infinite}.hero h1{font-size:clamp(30px,6vw,46px);margin:0;letter-spacing:-1.5px}.hero h1 span{background:linear-gradient(90deg,#9ba7ff,#63e5ed);background-clip:text;color:transparent}.hero p{color:var(--muted);margin:8px 0}
@keyframes float{50%{transform:translateY(-8px);box-shadow:0 0 75px #687cff88}}
#messages{display:flex;flex-direction:column;gap:14px;padding:8px 0 20px}.msg{max-width:85%;padding:13px 16px;border:1px solid var(--line);border-radius:17px;background:#111a2d;white-space:pre-wrap;overflow-wrap:anywhere}.msg.user{align-self:flex-end;background:linear-gradient(135deg,#343d83,#263d69);border-color:#6575d966}.msg.assistant{align-self:flex-start}.msg small{display:block;color:#a8b7d1;font-size:10px;margin-bottom:5px;text-transform:uppercase;letter-spacing:1px}
.suggestions{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:4px 0 20px}.suggestions button{border:1px solid var(--line);background:#111a2d;color:#cbd7ed;padding:9px 13px;border-radius:20px;cursor:pointer}.suggestions button:hover{border-color:var(--accent);color:white}
.composer{background:#111a2d;border:1px solid #344362;border-radius:20px;padding:10px;display:flex;gap:8px;align-items:flex-end;box-shadow:0 15px 55px #0005}.composer textarea{flex:1;resize:none;min-height:44px;max-height:150px;border:0;outline:0;background:transparent;color:white;font:inherit;padding:10px}.iconbtn,.send{border:0;border-radius:13px;width:44px;height:44px;cursor:pointer;color:white;background:#202d49;font-size:18px}.send{background:linear-gradient(135deg,#7888ff,#43cbdc);color:#07101b;font-weight:900}.iconbtn:hover,.send:hover{filter:brightness(1.15)}.hint{text-align:center;color:#71819e;font-size:11px;margin:10px}
footer{display:flex;justify-content:space-between;color:#71819e;font-size:11px;padding:12px 0;border-top:1px solid #ffffff12}footer button{background:none;border:0;color:#9eacd0;cursor:pointer}
@media(max-width:600px){.app{padding:14px}main{margin:22px auto}.hero{margin:15px 0 20px}.msg{max-width:94%}footer{gap:10px;flex-wrap:wrap}}
</style></head>
<body><div class="app"><header><div class="brand"><div class="logo">J</div>JASON AI</div><div class="status">Interface ready</div></header>
<main><section class="hero" id="hero"><div class="orb"></div><h1>Meet <span>Jason.</span></h1><p>Your ideas. Your questions. One intelligent space.</p></section>
<div id="messages" aria-live="polite"></div>
<div class="suggestions" id="suggestions"><button>Help me learn something</button><button>Write a short story</button><button>Explain how AI works</button></div>
<div class="composer"><button class="iconbtn" id="mic" title="Voice input" aria-label="Voice input">🎙</button><textarea id="input" rows="1" placeholder="Message Jason..." aria-label="Message Jason"></textarea><button class="send" id="send" aria-label="Send message">➤</button></div><div class="hint">Enter to send · Shift + Enter for a new line</div></main>
<footer><span>JASON AI · FIRST BUILD</span><button id="clear">Clear conversation</button><span>Chats stay in this browser</span></footer></div>
<script>
const box=document.querySelector('#messages'),input=document.querySelector('#input'),hero=document.querySelector('#hero'),suggestions=document.querySelector('#suggestions');
let history=[];try{history=JSON.parse(localStorage.getItem('jason-chat')||'[]')}catch{}
function add(role,text,save=true){hero.style.display='none';suggestions.style.display='none';const el=document.createElement('div');el.className='msg '+role;const label=document.createElement('small');label.textContent=role==='user'?'You':'Jason';const body=document.createElement('div');body.textContent=text;el.append(label,body);box.append(el);if(save){history.push({role,text});localStorage.setItem('jason-chat',JSON.stringify(history.slice(-80)))}box.scrollTop=box.scrollHeight;window.scrollTo(0,document.body.scrollHeight)}
function reply(text){const q=text.toLowerCase();if(/\b(hi|hello|hey)\b/.test(q))return 'Hello! I’m Jason. What would you like to explore today?';if(q.includes('your name'))return 'I’m Jason AI — your personal assistant.';if(q.includes('who made you'))return 'I’m the Jason AI project, created for you. My real AI brain will be connected when a model API is configured.';if(q.includes('help'))return 'I can welcome you, keep this conversation in your browser, and use voice features supported by your device. To answer open-ended questions intelligently, this interface needs a secure AI backend.';return 'I received your message. My chat interface is working, but I’m not connected to an AI model yet. The next step is to connect a secure backend (for example, an API route using an AI provider) so I can generate real answers. Never put a secret API key in this public webpage.'}
function send(){const t=input.value.trim();if(!t)return;add('user',t);input.value='';setTimeout(()=>{const answer=reply(t);add('assistant',answer);if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(answer);u.rate=1; speechSynthesis.speak(u)}},350)}
document.querySelector('#send').onclick=send;input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});document.querySelectorAll('.suggestions button').forEach(b=>b.onclick=()=>{input.value=b.textContent;send()});
document.querySelector('#clear').onclick=()=>{history=[];localStorage.removeItem('jason-chat');box.innerHTML='';hero.style.display='block';suggestions.style.display='flex'};
if(history.length){hero.style.display='none';suggestions.style.display='none';history.forEach(m=>add(m.role,m.text,false))}
const mic=document.querySelector('#mic');const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){mic.onclick=()=>{const r=new SR();r.lang=navigator.language||'en-US';r.onresult=e=>{input.value=e.results[0][0].transcript;send()};r.onerror=()=>add('assistant','Voice input was unavailable. You can type your message instead.');r.start()}}else{mic.disabled=true;mic.title='Voice input is not supported in this browser'}
</script></body></html>
